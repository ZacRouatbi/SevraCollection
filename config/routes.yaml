controllers:
    resource: ../src/Controller/
    type: attribute

home:
    path: /
    controller: App\Controller\HomeController::index

login:
    path: /login
    controller: App\Controller\SecurityController::login

login_check:
    path: /login-check

logout:
    path: /logout

shop:
    path: /shop
    controller: App\Controller\ShopController::index

gallery:
    path: /gallery
    controller: App\Controller\GalleryController::index

cart:
    path: /cart
    controller: App\Controller\CartController::index

cart_add:
    path: /cart/add
    controller: App\Controller\CartController::add
    methods: [POST]

cart_remove:
    path: /cart/remove
    controller: App\Controller\CartController::remove
    methods: [POST]

cart_update:
    path: /cart/update
    controller: App\Controller\CartController::update
    methods: [POST]

cart_state:
    path: /cart/state
    controller: App\Controller\CartController::state
    methods: [GET]

account:
    path: /account
    controller: App\Controller\AccountController::index

account_update:
    path: /account/update
    controller: App\Controller\AccountController::update

register:
    path: /register
    controller: App\Controller\RegistrationController::register

checkout:
    path: /checkout
    controller: App\Controller\CheckoutController::index

checkout_confirm:
    path: /checkout/confirm
    controller: App\Controller\CheckoutController::confirm
editorial:
    path: /editorial
    controller: App\Controller\EditorialController::index

editorial_show:
    path: /editorial/{slug}
    controller: App\Controller\EditorialController::show

about:
    path: /about
    controller: App\Controller\AboutController::index

reset_password_request:
    path: /reset-password/request
    controller: App\Controller\PasswordResetController::request
    methods: [POST]

reset_password_update:
    path: /reset-password/update
    controller: App\Controller\PasswordResetController::update
    methods: [POST]

reset_password_form:
    path: /reset-password/{token}
    controller: App\Controller\PasswordResetController::showResetForm
    methods: [GET]

product_detail:
    path: /produit/{slug}
    controller: App\Controller\ProductController::show
