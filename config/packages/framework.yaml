# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    session:
        handler_id: null
        cookie_secure: true  # CRITICAL: Always secure in production
        cookie_samesite: strict  # Enhanced security for checkout flows

    php_errors:
        log: true

    error_controller: App\Controller\ErrorController::show

    http_client:
        default_options:
            verify_peer: true  # CRITICAL: Enable SSL verification
            verify_host: true  # CRITICAL: Enable host verification
            timeout: 8
            max_duration: 10
        scoped_clients:
            woocommerce.http_client:
                base_uri: '%env(WORDPRESS_URL)%'
                verify_peer: true  # CRITICAL: Enable for WooCommerce API
                verify_host: true  # CRITICAL: Enable for WooCommerce API
                timeout: 8
                max_duration: 10

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
