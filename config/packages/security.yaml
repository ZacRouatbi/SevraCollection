security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        wp_user_provider:
            id: App\Security\WordPress\UserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build|css|images|js)/
            security: false

        main:
            lazy: true
            provider: wp_user_provider

            custom_authenticator: App\Security\WordPress\Authenticator
            entry_point: App\Security\WordPress\AuthenticationEntryPoint

            logout:
                path: logout
                target: home
                invalidate_session: true
                delete_cookies: ['PHPSESSID','main_deauth_profile_token']

    access_control:
        - { path: ^/account, roles: ROLE_USER }
        - { path: ^/checkout, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
