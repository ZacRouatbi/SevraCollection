security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        wp_user_provider:
            id: App\Security\WordPress\UserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build|css|images|js)/
            security: false

        main:
            lazy: true
            provider: wp_user_provider
            # ✅ FIXED: Use login_throttling (valid Symfony option)
            custom_authenticator: App\Security\WordPress\Authenticator
            entry_point: App\Security\WordPress\AuthenticationEntryPoint

            logout:
                path: logout
                target: home
                invalidate_session: true
                delete_cookies: ['PHPSESSID','main_deauth_profile_token']

    access_control:
        - { path: ^/account, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10

# ✅ Rate limiter configuration (used by login_throttling + manual checks)
framework:
    rate_limiter:
        login_limiter:
            policy: 'fixed_window'
            limit: 5
            interval: '5 minutes'
        checkout_limiter:
            policy: 'fixed_window'
            limit: 5
            interval: '5 minutes'
        cart_limiter:
            policy: 'fixed_window'
            limit: 30
            interval: '1 minute'
