services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true
        autoconfigure: true

    # makes classes in src/ available to be used as services
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Add this if autowiring doesn't work
    App\Security\WordPress\AuthenticationEntryPoint:
        arguments:
            $urlGenerator: '@router'

    App\Security\WordPress\Authenticator:
        arguments:
            $wpUrl: '%env(WORDPRESS_URL)%'
    App\Service\PasswordResetService:
        arguments:
            $mailerFrom:   '%env(SMTP_FROM)%'
            $wpUrl:        '%env(WORDPRESS_URL)%'
            $wpApiSecret:  '%env(WP_API_SECRET)%'
    App\Service\AccountService:
        arguments:
            $wpUrl:        '%env(WORDPRESS_URL)%'
            $wpApiSecret:  '%env(WP_API_SECRET)%'
