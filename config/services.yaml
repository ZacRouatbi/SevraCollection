services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Ensure CartService is defined if not automatically loaded
    App\Service\CartService: ~

    App\Security\WordPress\AuthenticationEntryPoint:
        arguments:
            $urlGenerator: '@router'

    App\Security\WordPress\Authenticator:
        arguments:
            $wpUrl: '%env(WORDPRESS_URL)%'

    App\Service\PasswordResetService:
        arguments:
            $mailerFrom:  '%env(SMTP_FROM)%'
            $wpUrl:       '%env(WORDPRESS_URL)%'
            $wpApiSecret: '%env(WP_API_SECRET)%'

    App\Service\AccountService:
        arguments:
            $wpUrl:       '%env(WORDPRESS_URL)%'
            $wpApiSecret: '%env(WP_API_SECRET)%'

    App\Service\WooCommerceService:
        arguments:
            $client:   '@woocommerce.http_client'
            $wpUrl:    '%env(WORDPRESS_URL)%'
            $wcKey:    '%env(WC_CONSUMER_KEY)%'
            $wcSecret: '%env(WC_CONSUMER_SECRET)%'

    App\Security\LoginSuccessHandler:
        arguments:
            $cartService:  '@App\Service\CartService'
            $urlGenerator: '@router'
